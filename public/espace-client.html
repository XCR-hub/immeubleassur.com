<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Espace client securise ImmeubleAssur pour suivre un dossier courtage, transmettre les pieces et piloter son contrat." />
    <link rel="canonical" href="https://immeubleassur.com/espace-client" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/styles.css?v=c6fd5d38f7" />
    <title>Espace client - ImmeubleAssur</title>
  </head>
  <body class="plain-page client-portal-page">
    <header class="site-header" data-elevate>
      <a class="brand" href="/" aria-label="ImmeubleAssur accueil">
        <span class="brand-mark" aria-hidden="true">IA</span>
        <span><strong>ImmeubleAssur</strong><small>courtier immeuble</small></span>
      </a>
      <a class="header-phone" href="tel:+33180855786">01 80 85 57 86</a>
    </header>
    <main class="plain-main client-portal-main">
      <section class="portal-hero">
        <div>
          <p class="eyebrow dark">Espace client</p>
          <h1>Suivi de votre dossier assurance immeuble</h1>
        </div>
        <form class="portal-token-form" id="portal-token-form">
          <label>Jeton dossier<input id="portal-token" name="token" autocomplete="one-time-code" placeholder="Collez votre jeton" /></label>
          <button class="submit-button" type="submit">Ouvrir</button>
        </form>
      </section>
      <p class="form-status" id="portal-status" role="status" aria-live="polite"></p>
      <section class="portal-grid" id="portal-content" hidden>
        <article class="portal-panel portal-status-panel">
          <span>Dossier</span>
          <h2 data-case-reference>-</h2>
          <p data-case-stage>-</p>
          <div class="portal-progress"><span data-case-progress></span></div>
          <small data-case-next-action></small>
        </article>
        <article class="portal-panel">
          <span>Bien</span>
          <h2 data-case-city>-</h2>
          <p data-case-need>-</p>
        </article>
        <article class="portal-panel portal-documents-panel">
          <span>Pieces dossier</span>
          <h2 data-documents-count>-</h2>
          <div id="portal-documents"></div>
        </article>
        <article class="portal-panel">
          <span>Consultations</span>
          <h2 data-consultations-count>-</h2>
          <div id="portal-consultations"></div>
        </article>
        <article class="portal-panel portal-contracts-panel">
          <span>Contrat</span>
          <h2 data-contracts-count>-</h2>
          <div id="portal-contracts"></div>
        </article>
        <article class="portal-panel portal-payments-panel">
          <span>Prime</span>
          <h2 data-payments-count>-</h2>
          <div id="portal-payments"></div>
        </article>
        <article class="portal-panel portal-requests-panel">
          <span>Demandes</span>
          <h2 data-requests-count>-</h2>
          <form class="portal-mini-form" id="portal-request-form">
            <label>Type
              <select name="request_type">
                <option value="document">Document</option>
                <option value="endorsement">Avenant / modification</option>
                <option value="renewal">Renouvellement</option>
                <option value="payment_issue">Paiement / prime</option>
                <option value="claim">Sinistre</option>
                <option value="asset_update">Parc immobilier</option>
              </select>
            </label>
            <label>Sujet<input name="subject" maxlength="180" placeholder="Votre demande" /></label>
            <button class="submit-button compact-action" type="submit">Creer</button>
          </form>
          <div id="portal-requests"></div>
        </article>
        <article class="portal-panel portal-consent-panel">
          <span>Consentements</span>
          <h2>Preferences</h2>
          <div id="portal-consents"></div>
        </article>
        <article class="portal-panel portal-referral-panel">
          <span>Parrainage</span>
          <h2 data-referral-code>-</h2>
          <form class="portal-mini-form" id="portal-referral-form">
            <label>Nom filleul<input name="filleul_name" maxlength="160" placeholder="Nom du filleul" /></label>
            <label>Email filleul<input name="filleul_email" type="email" maxlength="180" placeholder="email@exemple.fr" /></label>
            <label>Telephone filleul<input name="filleul_phone" type="tel" maxlength="80" placeholder="Optionnel" /></label>
            <label class="portal-check"><input name="explicit_permission" type="checkbox" /> Le filleul m'a autorise a transmettre ce contact.</label>
            <button class="submit-button compact-action" type="submit">Proposer</button>
          </form>
          <div id="portal-referrals"></div>
        </article>
        <article class="portal-panel portal-assets-panel">
          <span>Parc</span>
          <h2 data-assets-count>-</h2>
          <form class="portal-mini-form" id="portal-asset-form">
            <label>Bien<input name="label" maxlength="180" placeholder="Immeuble, SCI, adresse..." /></label>
            <label>Lots<input name="units_count" maxlength="40" placeholder="Nombre de lots" /></label>
            <label>Adresse<input name="address" maxlength="240" placeholder="Adresse ou ville" /></label>
            <label>Occupation<input name="occupancy" maxlength="120" placeholder="Locatif, vacant, mixte..." /></label>
            <button class="submit-button compact-action" type="submit">Mettre a jour</button>
          </form>
          <div id="portal-assets"></div>
        </article>
      </section>
    </main>
    <script src="/assets/app.js?v=0668b86d0e" type="module"></script>
    <script src="/assets/client-portal.js?v=617ffc1a4b" type="module"></script>
  </body>
</html>
