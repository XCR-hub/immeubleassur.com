name: Editorial Autopilot

on:
  schedule:
    - cron: "44 4 * * *"
  workflow_dispatch:

jobs:
  editorial-autopilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate base site
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: npm run generate

      - name: Run editorial watch with AI when configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          HUGGINGFACE_MODEL: ${{ secrets.HUGGINGFACE_MODEL }}
        run: npm run editorial:autopilot -- --fetch --ai

      - name: Run media autopilot with Pexels when configured
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npm run media:autopilot -- --fetch

      - name: Enforce AI legal quarantine
        run: npm run editorial:legal:safety

      - name: Enforce fresh official evidence gate
        run: npm run editorial:publication:gate

      - name: Enforce editorial text quality
        run: npm run editorial:text:quality

      - name: Enforce AI discoverability policy
        run: npm run ai:discoverability:contract

      - name: Validate site and functions
        run: npm run check

      - name: Upload editorial reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: immeubleassur-editorial-reports
          path: |
            reports/editorial-autopilot-report.json
            reports/editorial-drafts/**/*.json
            public/assets/editorial-autopilot-latest.json
            reports/media-autopilot-report.json
            public/assets/media-autopilot-latest.json
            reports/local-antifraud-report.json
            public/assets/local-antifraud-latest.json