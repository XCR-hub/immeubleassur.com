name: Production checkout checks

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .gitignore
      - scripts/update-local-production-checkout.ps1
      - scripts/production-checkout.test.js
      - scripts/*runtime*.ps1
      - scripts/local-runtime-report-cycle.js
      - scripts/live-ready-connectors-runner.js
      - scripts/scheduled-task-health*.js
      - scripts/runtime-monitoring.test.js
      - .github/workflows/production-checkout.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .gitignore
      - scripts/update-local-production-checkout.ps1
      - scripts/production-checkout.test.js
      - scripts/*runtime*.ps1
      - scripts/local-runtime-report-cycle.js
      - scripts/live-ready-connectors-runner.js
      - scripts/scheduled-task-health*.js
      - scripts/runtime-monitoring.test.js
      - .github/workflows/production-checkout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-checkout:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the deployment safeguards
        run: node scripts/production-checkout-lock-contract-check.js
      - name: Exercise the updater against an isolated checkout and HTTP server
        run: node --test scripts/production-checkout.test.js
      - name: Check unattended monitoring and continuous services
        run: |
          node --test scripts/runtime-monitoring.test.js
          node scripts/scheduled-task-health-contract-check.js
          node scripts/runtime-report-redaction-contract-check.js
