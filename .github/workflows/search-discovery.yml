name: Search discovery and documented guides

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'public/**'
      - package.json
      - package-lock.json
      - .github/workflows/search-discovery.yml
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'public/**'
      - package.json
      - package-lock.json
      - .github/workflows/search-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Rebuild without paid API connectors
        run: npm run generate
      - name: Validate public journeys and search discovery
        run: npm run check
      - name: Exercise cold mobile loads and quote prefill in Chrome
        run: node scripts/page-stability-browser-check.js
