name: SEO Autopilot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  seo-autopilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate static site and local SEO report
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: npm run generate

      - name: Validate JavaScript
        run: npm run check

      - name: Run SEO APIs when configured
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GOOGLE_URL_INSPECTION_LIMIT: 8
        run: npm run seo:apis

      - name: Run search intelligence with SerpApi when configured
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: npm run search:intelligence -- --serp

      - name: Upload SEO reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: immeubleassur-seo-reports
          path: |
            reports/seo-autopilot-report.json
            reports/seo-autopilot-report.md
            reports/seo-content-factory.json
            reports/seo-growth-summary.json
            reports/seo-growth-actions.json
            reports/content-quality-report.json
            reports/conversion-intelligence-report.json
            reports/cro-experiment-report.json
            reports/lead-friction-report.json
            reports/local-antifraud-report.json
            public/assets/content-quality-latest.json
            public/assets/conversion-intelligence-latest.json
            public/assets/cro-experiment-latest.json
            public/assets/lead-friction-latest.json
            public/assets/local-antifraud-latest.json
            public/assets/seo-autopilot-latest.json
            reports/editorial-autopilot-report.json
            public/assets/editorial-autopilot-latest.json
            reports/search-intelligence-report.json
            public/assets/search-intelligence-latest.json
            reports/live-api-readiness-report.json
            public/assets/live-api-readiness-latest.json
            reports/google-readiness-unlock-report.json
            public/assets/google-readiness-unlock-latest.json